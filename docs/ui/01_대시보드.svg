  <text x="927" y="826" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="12" font-weight="400" fill="#67788D">사진 빈도와 하루 직접 노출시간은 별도입니다.</text>
  <rect x="927" y="846" width="448" height="46" rx="5" fill="#F0F4F8" stroke="#DDE3EA" stroke-width="1" />
