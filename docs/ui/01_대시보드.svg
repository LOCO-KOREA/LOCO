  <text x="80" y="590" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="13" fill="#1B2635">입력 부족 3개 기준 · 추가 검토 2개 기준 · REBA 미완료 4장 / 45슬롯</text>
