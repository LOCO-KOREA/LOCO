  <text x="40" y="183" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="14" font-weight="400" fill="#67788D">상자 올리기 작업의 분석 결과와 조사자 검토 상태를 한곳에서 봅니다.</text>
